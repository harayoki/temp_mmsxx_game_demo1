<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover で画面の端まで使う。**ノッチや丸い角に食われるぶん**は
     env(safe-area-inset-*) で読んで、パッドの側で空ける
     (engine/util/touchgui.js)。書かないと env() は 0 を返し、
     食われるぶんはブラウザが勝手に空ける代わりに画面がそのぶん狭くなる -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STAR FABLE - MSX-like Engine Demo</title>
<base href="/">
<meta name="twitter:card" content="summary_large_image">
<meta property="og:type" content="website">
<meta property="og:title" content="STAR FABLE">
<meta property="og:description" content="Claudeが絵もサウンドもプログラムも全部作ったMSX1 風の縦スクロールシューティング。ブラウザでそのまま遊べます。">
<meta property="og:url" content="https://msxpoi1.pages.dev/">
<meta property="og:image" content="https://msxpoi1.pages.dev/default-og-image.png">
<style>
  /* 画面の外(DOM)に出す字。**8x8 のドット絵フォント**(美咲ゴシック 第2版)。
     エンジンの字とまったく同じ 8x8 の枠なので、canvas の中と外で顔がそろう。
     **自分のところに置いて自前で配る**ので、外へは通信しない。
     ライセンス表記は要らない(M+ と同じ「自由に使ってよい」文面) */
  @font-face {
    font-family: 'misaki';
    /* 使う字だけに削ったもの。作りかたは tools/subset-font.mjs (npm run font) */
    src: url('./assets/fonts/misaki.woff2') format('woff2');
    font-display: block;   /* 読めるまで別の字で出さない(切り替わりが目立つため) */
  }
  /* 部品(engine/util/touchgui.js)はこの変数だけを見る。
     置き場所を知っているのはゲームの側 */
  :root { --mmsxx-gui-font: 'misaki', monospace; }
  html, body {
    margin: 0;
    height: 100%;
    background: #17181f;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  canvas {
    image-rendering: pixelated;
    border: 4px solid #333;
    outline: 4px solid #111;
    max-width: 100%;
  }
  p {
    color: #8890a8;
    font-family: monospace;
    font-size: 13px;
  }
  #stage {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #tools {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #tools button {
    font-size: 20px;
    line-height: 1;
    width: 40px;
    height: 40px;
    padding: 0;
    color: #e8e8e8;
    background: #202020 no-repeat center;
    background-size: 32px 32px;
    image-rendering: pixelated;
    border: 2px solid #cccccc;
    cursor: pointer;
  }
  #tools button:hover { border-color: #ffe000; }
  /* **これ以上押せないボタンは、枠ごと灰色にする。**(＋ / − が端まで来たとき)
     押せないものと押せるものを、まず枠で見分けられるようにする */
  #tools button.off { filter: grayscale(1) brightness(0.55); cursor: default; }
  #tools button.off:hover { border-color: #cccccc; }
  /* **切り替えのボタン(ピクセルパーフェクトや音)はいつでも押せる**ので、
     枠は白いまま。**中の絵だけ**を色/モノクロで切り替えて状態を知らせる
     (絵の側は game/main.js が作り直している) */
  #dev-badge {
    display: none;
    font-family: monospace;
    font-size: 12px;
    letter-spacing: 1px;
    text-align: center;
    color: #ff5555;
  }
  /* 新しく増えた操作なので、ここだけ目立たせる */
  .gamepad { color: #ffe000; }
  p.notice a { color: #8fa2d8; }
  p.notice {
    color: #6b7288;
    font-size: 12px;
    line-height: 1.6;
    margin: 4px 8px 0;
    text-align: center;
  }
  /* スマホのバーチャルパッドを出しているあいだ。**canvas の外の文字を消す**。
     操作の案内は画面の左右の空きへ出るので、下に並べた文字は要らなくなる。
     消したぶん縦が空くので、ゲーム画面が 1 段階大きくなる
     (印はゲーム側が付ける。game/main.js の TouchGui を参照) */
  body.touch-gui p { display: none; }
  #error {
    display: none;
    max-width: 90vw;
    margin: 8px;
    padding: 12px;
    background: #2a1520;
    border: 1px solid #a04060;
    color: #ffb0c0;
    font-family: monospace;
    font-size: 12px;
    white-space: pre-wrap;
    overflow-x: auto;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="screen" width="272" height="208"></canvas>
  <div id="tools">
    <!-- **並びは優先順**。狭い帯では下から折り返して見えなくなるので、
         いちばん要るものを先頭に置く: ミュート → ＋ → － → SHARE -->
    <button id="mute" type="button" title="SOUND ON / OFF"></button>
    <!-- 絵は engine/util/icons.js のドットの並びから作る(game/main.js が入れる)。
         **画面のスプライトと同じ並び**なので、canvas の中と外で顔が食い違わない -->
    <button id="zoom-in" type="button" title="SCREEN BIGGER"></button>
    <button id="zoom-out" type="button" title="SCREEN SMALLER"></button>
    <button id="pixel-fit" type="button" title="PIXEL PERFECT"></button>
    <button id="share-btn" type="button" title="SCREENSHOT" aria-label="SCREENSHOT"></button>
    <!-- OS へ画像を渡す。**渡せる環境でだけ出す**(game/main.js が判定する)。
         Firefox など navigator.share の無いところでは最初から出さない -->
    <button id="os-share" type="button" title="SHARE IMAGE" aria-label="SHARE IMAGE"
            style="display:none"></button>
    <!-- 画面の大きさ。**遊ぶ人が自分で決められる**ようにしておく。
         機種ごとの空きの取りかたは自動で決めているが、
         好みや持ちかたで合わないことがあるので、逃げ道を用意する -->
    <span id="dev-badge">DEV</span>
  </div>
</div>
<p>ARROWS: MOVE / SPACE: SHOT / ESC: PAUSE / ALT+S: COPY SCREEN / ALT+M: MUTE / ALT+P: SHARE / <span class="gamepad">GAMEPAD: PRESS ANY BTN ON TITLE</span></p>
<p class="notice">
  テスト運用中です。ランキングの記録は予告なくリセットされることがあります。<br>
  This game is under test operation. The ranking records may be reset without notice.
</p>
<p class="notice">
  <a href="https://www.cloudflare.com/turnstile-privacy-policy/" target="_blank" rel="noopener">Turnstile Privacy Addendum</a>
</p>
<pre id="error"></pre>
<script>
  function showError(msg) {
    var el = document.getElementById('error');
    el.style.display = 'block';
    el.textContent += msg + '\n';
  }
  // **読めなくても遊べるもの。** アクセス数のビーコンは広告ブロッカーに
  // 止められることが多い。止められたぶんは数えられなくなるだけで、
  // ゲームには何の関わりもないので、エラー欄に出さない
  // (出すと、遊びに来た人には**故障したように見える**)
  var OPTIONAL_SRC = ['cloudflareinsights.com'];
  function optionalScript(src) {
    for (var i = 0; i < OPTIONAL_SRC.length; i++) {
      if (src.indexOf(OPTIONAL_SRC[i]) >= 0) return true;
    }
    return false;
  }
  window.addEventListener('error', function (e) {
    if (e.target && e.target.tagName === 'SCRIPT') {
      var src = e.target.src || '';
      if (optionalScript(src)) return;
      showError('スクリプトの読み込みに失敗: ' + src);
    } else {
      showError('エラー: ' + (e.message || e.error) + '\n  at ' + (e.filename || '') + ':' + (e.lineno || ''));
    }
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    showError('未処理の例外: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
  // file:// では ES モジュールが読めない。**どれが読めないのか**まで出す。
  // module のタグはこの下にあるので、並び終わってから数える
  function warnFileProtocol() {
    var list = [].slice.call(document.querySelectorAll('script[type="module"]'))
      .map(function (s) { return s.getAttribute('src'); })
      .filter(Boolean);
    showError('file:// で直接開くと ES モジュールが読み込めません。\n'
      + '読めないもの: ' + (list.length ? list.join(' / ') : '(module なし)') + '\n'
      + 'ウェブサーバー経由 (http/https) で開いてください。');
  }
  if (location.protocol === 'file:') {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', warnFileProtocol);
    } else {
      warnFileProtocol();
    }
  }
</script>
<script type="module" src="./game/main.js"></script>
<script type="module" src="./game/wavexport.js"></script>
<!-- ここに Cloudflare Web Analytics のビーコンが入る。**公開版のときだけ**。
     差し込むのは build-deploy.ps1。ソースのままでは外へ通信しないので、
     手元で開いても開発中の行き来が数字に混ざらない -->
<!-- MMSXX-WEB-ANALYTICS -->
</body>
</html>
