<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover で画面の端まで使う。**ノッチや丸い角に食われるぶん**は
     env(safe-area-inset-*) で読んで、パッドの側で空ける
     (engine/util/touchgui.js)。書かないと env() は 0 を返し、
     食われるぶんはブラウザが勝手に空ける代わりに画面がそのぶん狭くなる -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- **ホーム画面に追加すると全画面になる。** iPhone の Safari は
     requestFullscreen() に対応していないので、狭さを何とかする道はこれだけ。
     アドレスバーとタブが消えるぶん、ゲーム画面が 1 段階大きくなる
     (docs/SMARTPHONE.md の 7-2 節)。iOS は古い apple-* の指定を見る -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="STAR FABLE">
<!-- **ホーム画面に置いたときの姿。** Android はこれを見る(iOS は上の apple-*)。
     **画面の向き(orientation)は書かない。** 書くと端末が実際に回ってしまい、
     縦持ちのときに canvas を 90 度回して見せている今の作りと二重になる
     (engine/video.js の _applyCssSize)。
     Service Worker は置かない。**インストールの要件からは外れている**
     (Chrome 108 / デスクトップ 112 以降)し、オフライン対応もしない -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#000000">
<!-- アイコンは tools/makeicons.mjs が自機のドット絵から作る -->
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>STAR FABLE - MSX-like Engine Demo</title>
<base href="/">
<meta name="twitter:card" content="summary_large_image">
<meta property="og:type" content="website">
<meta property="og:title" content="STAR FABLE">
<meta property="og:description" content="Claudeが絵もサウンドもプログラムも全部作ったMSX1 風の縦スクロールシューティング。ブラウザでそのまま遊べます。">
<meta property="og:url" content="https://msxpoi1.pages.dev/">
<meta property="og:image" content="https://msxpoi1.pages.dev/default-og-image.png">
<style>
  /* 画面の外(DOM)に出す字。**8x8 のドット絵フォント**(美咲ゴシック 第2版)。
     エンジンの字とまったく同じ 8x8 の枠なので、canvas の中と外で顔がそろう。
     **自分のところに置いて自前で配る**ので、外へは通信しない。
     ライセンス表記は要らない(M+ と同じ「自由に使ってよい」文面) */
  @font-face {
    font-family: 'misaki';
    /* 使う字だけに削ったもの。作りかたは tools/subset-font.mjs (npm run font) */
    src: url('./assets/fonts/misaki.woff2') format('woff2');
    font-display: block;   /* 読めるまで別の字で出さない(切り替わりが目立つため) */
  }
  /* 部品(engine/util/touchgui.js)はこの変数だけを見る。
     置き場所を知っているのはゲームの側 */
  :root { --mmsxx-gui-font: 'misaki', monospace; }
  html, body {
    margin: 0;
    height: 100%;
    background: #17181f;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    /* **二度たたきの拡大だけを切る。つまむのは残す。**
       画面の大きさは ＋ / − で決める作りなので、つまんでの拡大は要らない。
       それでも残すのは**戻る道を塞がないため**。
       一度 none にしてみたが、それでも実機で拡大が起きた。あれは
       **OS のズーム(アクセシビリティ)で、ページ側からは止められない**。
       そのときページ側もつまめなくしてあると、**縮める手が無くなる**
       (OS のズームは 3 本指、ページのズームはつまむ。どちらで起きたのか
        使う人には区別がつかない)。
       ページ自体はもともと固定していて送れない
       (engine/util/touchgui.js が .mmsxx-gui-on で貼り付けている) */
    touch-action: manipulation;
    /* 横向きにしたときに字だけ大きくされるのを止める(ドット絵の升目がずれる) */
    -webkit-text-size-adjust: 100%;
  }
  /* **指で遊ぶあいだは、文字を選ばせない。**
     十字をいじっていると、そのうち字が青く反転して選択になってしまう。
     長押しの吹き出し(コピー / 調べる)も出さない。
     **選ばせたいのは重ねて出す板の中だけ** — あそこはシェアの文言を
     つまんで持っていく場所なので、下の行で戻している */
  body.touch-gui, body.touch-gui * {
    user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* **板の中は縦に送れるようにする。** 横持ちの短い画面では中身が溢れることがあり、
     上の none のままだと下のボタンまで届かない。打ち込み欄も素のままにしておく
     (文字を選ぶ・カーソルを運ぶのに要る) */
  #share > div, #a2hs > div, .pad-notice { touch-action: pan-y; }
  #soft-keys, #soft-keys input { touch-action: auto; }
  body.touch-gui #share, body.touch-gui #share *,
  body.touch-gui #a2hs, body.touch-gui #a2hs *,
  body.touch-gui .pad-notice, body.touch-gui .pad-notice *,
  body.touch-gui #soft-keys, body.touch-gui #soft-keys * {
    user-select: text; -webkit-user-select: text; -webkit-touch-callout: default;
  }
  canvas {
    image-rendering: pixelated;
    border: 4px solid #333;
    outline: 4px solid #111;
    max-width: 100%;
  }
  p {
    color: #8890a8;
    font-family: monospace;
    font-size: 13px;
  }
  #stage {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #tools {
    display: flex;
    flex-direction: column;
    /* **ボタンどうしの間も詰める。** 絵を小さくしたのは場所を空けるためなので、
       まわりの余白を残したままでは取り分が減らない */
    gap: 4px;
  }
  /* キーボードのボタンは右の空きへ移すので #tools の外に出る。
     **同じ大きさ・同じ見た目**にするため、こちらにも同じ指定を当てる */
  /* **囲みは付けない。** ゲームの道具であって画面の一部ではないので、
     枠と地の色まで置くと、そのぶん前へ出て弾を隠す。絵だけで足りる。
     **絵のまわりの余白も、絵と一緒に詰める**(7px → 3px)。
     はじめは箱を 40px のまま残したが、**場所を空けるのが狙い**なので、
     まわりが空いたままでは取り分が減らない。
     ここから先は押しやすさとの兼ね合いなので、実機で触って決めること */
  #tools button, #keyboard-btn {
    font-size: 20px;
    line-height: 1;
    width: 32px;
    height: 32px;
    padding: 0;
    color: #e8e8e8;
    background: none no-repeat center;
    background-size: 26px 26px;
    image-rendering: pixelated;
    border: 0;
    cursor: pointer;
  }
  /* **効きぐあいだけは字のボタン。** 絵では 3 段のどれなのかを表せない。
     左の空き(#tools の列)にそのまま並ぶので、幅と高さの決め打ちを外して
     字なりの大きさにする */
  /* **#tools button より強く書くこと。** `#pad-sense` だけでは
     上の `#tools button`(id + 要素)に負けて、32px の絵のボタンのままになる */
  #tools #pad-sense {
    width: auto;
    height: auto;
    padding: 6px 8px;
    /* **8 の倍数にする。** ドット絵の書体は決まった大きさでしか揃わない */
    font: 16px/1.4 var(--mmsxx-gui-font, monospace);
    letter-spacing: 0;
    color: #ffffff;
    background: #2a2a3c;
    border: 2px solid #ffffff;
    background-image: none;
    /* **2 行で出す。** 上に何のつまみかを書かないと、
       段の名前(HIGH)だけでは何が HIGH なのか分からない */
    white-space: pre;
    text-align: center;
  }
  /* **キーボードだけ横に長い。** ここは右の空きに 1 つで立っていて、
     十字や連射のように場所を覚えて押すものでもない。
     打ちたいときに確実に当てられるほうが要るので、横だけ倍にする。
     **絵も一緒に伸ばす。** 囲みを外してあるので、当たりだけ広げても
     見た目は何も変わらない(広くなったことが伝わらない)。
     横長のキーボードは、そもそも横に伸ばしたほうが それらしく見える */
  #keyboard-btn { width: 64px; background-size: 52px 26px; }
  /* 枠が無いので、指した合図は**明るさ**で出す(PC で触るときのため) */
  #tools button:hover, #keyboard-btn:hover { filter: brightness(1.4); }
  /* **これ以上押せないボタンは灰色に沈める。**(＋ / − が端まで来たとき) */
  #tools button.off, #keyboard-btn.off { filter: grayscale(1) brightness(0.55); cursor: default; }
  #tools button.off:hover, #keyboard-btn.off:hover { filter: grayscale(1) brightness(0.55); }
  /* **切り替えのボタン(ピクセルパーフェクトや音)はいつでも押せる。**
     **中の絵だけ**を色/モノクロで切り替えて状態を知らせる
     (絵の側は game/main.js が作り直している) */
  #dev-badge {
    display: none;
    font-family: monospace;
    font-size: 12px;
    letter-spacing: 1px;
    text-align: center;
    color: #ff5555;
  }
  /* 新しく増えた操作なので、ここだけ目立たせる */
  .gamepad { color: #ffe000; }
  p.notice a { color: #8fa2d8; }
  p.notice {
    color: #6b7288;
    font-size: 12px;
    line-height: 1.6;
    margin: 4px 8px 0;
    text-align: center;
  }
  /* スマホのバーチャルパッドを出しているあいだ。**canvas の外の文字を消す**。
     操作の案内は画面の左右の空きへ出るので、下に並べた文字は要らなくなる。
     消したぶん縦が空くので、ゲーム画面が 1 段階大きくなる
     (印はゲーム側が付ける。game/main.js の TouchGui を参照) */
  body.touch-gui p { display: none; }
  #error {
    display: none;
    max-width: 90vw;
    margin: 8px;
    padding: 12px;
    background: #2a1520;
    border: 1px solid #a04060;
    color: #ffb0c0;
    font-family: monospace;
    font-size: 12px;
    white-space: pre-wrap;
    overflow-x: auto;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="screen" width="272" height="208"></canvas>
  <div id="tools">
    <!-- **並びは優先順**。狭い帯では下から折り返して見えなくなるので、
         いちばん要るものを先頭に置く: ミュート → ＋ → － → SHARE -->
    <button id="mute" type="button" title="SOUND ON / OFF"></button>
    <!-- 絵は engine/util/icons.js のドットの並びから作る(game/main.js が入れる)。
         **画面のスプライトと同じ並び**なので、canvas の中と外で顔が食い違わない -->
    <button id="zoom-in" type="button" title="SCREEN BIGGER"></button>
    <button id="zoom-out" type="button" title="SCREEN SMALLER"></button>
    <button id="pixel-fit" type="button" title="PIXEL PERFECT"></button>
    <!-- 画面を 180 度回す。**ポーズ中だけ出す**(game/main.js)。
         寝ころんで遊ぶときや、ホームバーが指の側に来てしまうときのため。
         90 度は要らない(縦横の食い違いはエンジンが自動で合わせる) -->
    <button id="rotate-btn" type="button" title="TURN SCREEN 180"
            aria-label="TURN SCREEN 180" style="display:none"></button>
    <!-- 十字の効きぐあい。**ポーズ中だけ出す**(game/main.js)。
         押すたびに段が回る。指の速さと自機の速さの関係は好みが分かれるので、
         遊ぶ人が自分で決められるようにする。
         **ここだけ絵ではなく字**。3 段のうちどれなのかは絵では表せないし、
         棒グラフの絵では何のつまみかも伝わらなかった -->
    <button id="pad-sense" type="button" title="PAD SENSITIVITY"
            style="display:none"></button>
    <button id="share-btn" type="button" title="SCREENSHOT" aria-label="SCREENSHOT"></button>
    <!-- OS へ画像を渡す。**渡せる環境でだけ出す**(game/main.js が判定する)。
         Firefox など navigator.share の無いところでは最初から出さない -->
    <button id="os-share" type="button" title="SHARE IMAGE" aria-label="SHARE IMAGE"
            style="display:none"></button>
    <!-- 画面の大きさ。**遊ぶ人が自分で決められる**ようにしておく。
         機種ごとの空きの取りかたは自動で決めているが、
         好みや持ちかたで合わないことがあるので、逃げ道を用意する -->
    <!-- 文字を打つ(裏技の打ち込み)。**右の空きへ移す**(game/main.js)。
         打てる場面でだけ効かせ、それ以外は沈める -->
    <button id="keyboard-btn" type="button" title="KEYBOARD" aria-label="KEYBOARD"></button>
    <span id="dev-badge">DEV</span>
  </div>
</div>
<p>ARROWS: MOVE / SPACE: SHOT / ESC: PAUSE / ALT+S: COPY SCREEN / ALT+M: MUTE / ALT+P: SHARE / <span class="gamepad">GAMEPAD: PRESS ANY BTN ON TITLE</span></p>
<p class="notice">
  テスト運用中です。ランキングの記録は予告なくリセットされることがあります。<br>
  This game is under test operation. The ranking records may be reset without notice.
</p>
<p class="notice">
  <a href="https://www.cloudflare.com/turnstile-privacy-policy/" target="_blank" rel="noopener">Turnstile Privacy Addendum</a>
</p>
<pre id="error"></pre>
<script>
  function showError(msg) {
    var el = document.getElementById('error');
    el.style.display = 'block';
    el.textContent += msg + '\n';
  }
  // **読めなくても遊べるもの。** アクセス数のビーコンは広告ブロッカーに
  // 止められることが多い。止められたぶんは数えられなくなるだけで、
  // ゲームには何の関わりもないので、エラー欄に出さない
  // (出すと、遊びに来た人には**故障したように見える**)
  var OPTIONAL_SRC = ['cloudflareinsights.com'];
  function optionalScript(src) {
    for (var i = 0; i < OPTIONAL_SRC.length; i++) {
      if (src.indexOf(OPTIONAL_SRC[i]) >= 0) return true;
    }
    return false;
  }
  window.addEventListener('error', function (e) {
    if (e.target && e.target.tagName === 'SCRIPT') {
      var src = e.target.src || '';
      if (optionalScript(src)) return;
      showError('スクリプトの読み込みに失敗: ' + src);
    } else {
      showError('エラー: ' + (e.message || e.error) + '\n  at ' + (e.filename || '') + ':' + (e.lineno || ''));
    }
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    showError('未処理の例外: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
  // file:// では ES モジュールが読めない。**どれが読めないのか**まで出す。
  // module のタグはこの下にあるので、並び終わってから数える
  function warnFileProtocol() {
    var list = [].slice.call(document.querySelectorAll('script[type="module"]'))
      .map(function (s) { return s.getAttribute('src'); })
      .filter(Boolean);
    showError('file:// で直接開くと ES モジュールが読み込めません。\n'
      + '読めないもの: ' + (list.length ? list.join(' / ') : '(module なし)') + '\n'
      + 'ウェブサーバー経由 (http/https) で開いてください。');
  }
  if (location.protocol === 'file:') {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', warnFileProtocol);
    } else {
      warnFileProtocol();
    }
  }
</script>
<script type="module" src="./game/main.js"></script>
<script type="module" src="./game/wavexport.js"></script>
<!-- ここに Cloudflare Web Analytics のビーコンが入る。**公開版のときだけ**。
     差し込むのは build-deploy.ps1。ソースのままでは外へ通信しないので、
     手元で開いても開発中の行き来が数字に混ざらない -->
<!-- MMSXX-WEB-ANALYTICS -->
</body>
</html>
