<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>touch-tool - タッチ操作の実験台</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* iOS のバウンスは overscroll-behavior では止まらないので、ページごと固定する */
html, body {
  position: fixed; width: 100%; height: 100%; overflow: hidden;
  margin: 0; background: #101018; color: #ccccdd;
  font: 16px/1.5 monospace;
  touch-action: none;
  /* Safari は接頭辞つきでないと効かない */
  user-select: none; -webkit-user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
/* 計器盤の中の文字だけは選べるようにしておく(値を控えるため) */
#values { -webkit-user-select: text; user-select: text; }
/* 縦持ちのときに 90 度回すための入れ物。
   中身はすべてこの中に入れる(パッドも計器盤も)。
   transform を掛けると、中の position:fixed はこの入れ物を基準にしてくれる */
#stage {
  position: fixed; left: 0; top: 0; transform-origin: 0 0; overflow: hidden;
}
/* 道具の名前。**パッドのエリアの背景に薄く敷く。**
   エリアより先に置いてあるので、十字の絵はこの上に描かれる */
#brand {
  position: fixed; top: 18%; text-align: center; pointer-events: none;
  color: #2a3550; font-size: 13px; line-height: 1.6; letter-spacing: 2px;
}
/* パッドを置くエリア。**場所を決めるのは器の側**で、部品は中身だけ作る */
.zone { position: fixed; top: 0; bottom: 0; }
/* 計器盤。**本番でゲーム画面が出る場所**＝指が来ない場所に置く */
#panel {
  position: fixed; top: 0; bottom: 0;
  overflow-y: auto;   /* touch-action は layout() が向きに合わせて入れる */
  padding: 8px 10px; box-sizing: border-box;
  border-left: 1px solid #333344; border-right: 1px solid #333344;
}
/* 上に貼り付ける。つまみを開いて下へ送っても、連射量は見えたままにする */
/* 上に貼り付ける帯。**ここはスクロールで流れない。**
   いちばん見たいもの(連射量とキーの状態)だけを入れる */
.topbar {
  position: sticky; top: 0; z-index: 2;
  background: #101018; padding: 4px 0 6px;
  border-bottom: 1px solid #333344; margin-bottom: 6px;
}
.topbar button { margin-right: 6px; }
.topbar .big { line-height: 1; margin-left: auto; }
/* 連射数が 2 桁になっても折り返さない */
.row.nowrap { flex-wrap: nowrap; }
button.icon {
  padding: 5px 8px; margin-right: 4px; flex: none; line-height: 0;
}
button.icon svg {
  width: 20px; height: 20px; display: block;
  fill: none; stroke: currentColor; stroke-width: 2;
  stroke-linecap: square; stroke-linejoin: miter;
}
h2 {
  font-size: 14px; margin: 10px 0 4px; color: #7788aa;
  border-bottom: 1px solid #333344; font-weight: normal;
}
h2:first-child { margin-top: 0; }
.row { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.big { font-size: 30px; color: #ffcc22; }
.dim { color: #666677; }

/* ① キーの状態 */
.key {
  padding: 5px 9px; background: #222233; border: 1px solid #444455; color: #666677;
}
.key.down { background: #ffcc22; border-color: #ffee88; color: #111122; }
.key.hit  { border-color: #ffffff; }

/* ② タッチ点 */
.dot { display: inline-block; width: 10px; height: 10px; margin-right: 4px; }

/* ⑥ ログ */
#log { height: 120px; overflow: hidden; color: #889; font-size: 14px; }
#log div { white-space: pre; }
#log .p { color: #8fc; }
#log .r { color: #667; }

/* 長押しで出る説明 */
#knobHint {
  min-height: 2.6em; margin-top: 6px; padding: 4px 6px;
  color: #ffcc22; background: #1a1a26; border-left: 3px solid #ffcc22;
}
#knobHint:empty { visibility: hidden; }
/* 触ると説明が出る名前。**触れることが分かるように**下線を引く */
.askable {
  text-decoration: underline dotted #7788aa; text-underline-offset: 3px;
  cursor: help;
}

/* つまみ */
details { margin-top: 8px; border-top: 1px solid #333344; }
summary { cursor: pointer; padding: 8px 0; color: #7788aa; }
label.knob { display: flex; align-items: center; gap: 8px; padding: 5px 0; }
label.knob span:first-child { width: 128px; flex: none; }
label.knob output { width: 52px; flex: none; text-align: right; color: #ffcc22; }
/* スライダー。**指で掴めるように、つまみを大きくする。**
   既定のつまみは 12px ほどしかなく、指では狙えない */
input[type=range] {
  flex: 1; min-width: 80px; height: 36px; touch-action: none;
  -webkit-appearance: none; appearance: none; background: transparent;
}
input[type=range]::-webkit-slider-runnable-track {
  height: 10px; background: #2a2a3a; border: 1px solid #555566;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 30px; height: 30px; margin-top: -11px;
  background: #ffcc22; border: 2px solid #ffee88;
}
input[type=range]::-moz-range-track {
  height: 10px; background: #2a2a3a; border: 1px solid #555566;
}
input[type=range]::-moz-range-thumb {
  width: 28px; height: 28px; border-radius: 0;
  background: #ffcc22; border: 2px solid #ffee88;
}
button {
  font: 16px monospace; padding: 8px 14px; margin-right: 6px;
  background: #333344; color: #ccccdd; border: 1px solid #8888aa;
}
#values {
  width: 100%; height: 92px; box-sizing: border-box; margin-top: 6px;
  background: #0a0a12; color: #8fc; border: 1px solid #333344;
  font: 14px monospace; user-select: text;
}
</style>
</head>
<body>

<div id="stage">
<div id="brand">MMS-XX<br>TOUCH INTERFACE TESTER</div>
<div id="zoneA" class="zone"></div>
<div id="zoneB" class="zone"></div>
<div id="panel">
  <div class="topbar">
    <div class="row nowrap">
      <button id="rot" class="icon" title="90度回す" aria-label="90度回す"><svg viewBox="0 0 20 20"><path d="M5 3v9h8"/><path d="M10 9l3 3-3 3" fill="none"/></svg></button>
      <button id="swap" class="icon" title="左右を入れ替える" aria-label="左右を入れ替える"><svg viewBox="0 0 20 20"><path d="M3 7h14M13 3l4 4-4 4"/><path d="M17 13H3M7 9l-4 4 4 4"/></svg></button>
      <button id="reload" class="icon" title="読み直す" aria-label="読み直す"><svg viewBox="0 0 20 20"><path d="M16 10a6 6 0 1 1-1.8-4.3"/><path d="M16 2v4h-4"/></svg></button>
      <span class="big" id="rateTop">0</span>
      <span class="dim">発/秒</span>
    </div>
    <div class="row" id="keys" style="margin-top:4px"></div>
  </div>
  <div class="row dim" id="rotState" style="margin-bottom:6px"></div>

  <h2>① こすり打ち</h2>
  <div class="row">
    <span class="big" id="rate">0</span><span class="dim">発/秒</span>
    <span class="dim">最高</span><span id="maxRate">0</span>
  </div>
  <div id="rub" class="dim"></div>

  <h2>② 端末・画面</h2>
  <div id="device" class="dim"></div>

  <details open>
    <summary>パラメータ調整</summary>
    <div id="knobs"></div>
  </details>

  <details>
    <summary>GUI調整</summary>
    <div id="guiKnobs"></div>
  </details>

  <div id="knobHint"></div>
  <div class="row" style="margin-top:6px">
    <button id="reset">RESET</button>
    <button id="copy">COPY VALUES</button>
  </div>
  <textarea id="values" readonly></textarea>

  <h2>③ タッチ点 <span class="dim" id="touchCount"></span></h2>
  <div id="touches" class="dim">（触れていません）</div>

  <h2>④ 相対十字</h2>
  <div id="stick" class="dim">（触れていません）</div>

  <h2>⑤ ログ</h2>
  <div id="log"></div>
</div>
</div>

<script type="module">
import { TouchControls } from '../../engine/util/touch.js';
import { isMobileLike } from '../../engine/util/device.js';

// 指でつまむ拡大を潰す(user-scalable=no は iOS Safari が無視する)
for (const g of ['gesturestart', 'gesturechange', 'gestureend']) {
  document.addEventListener(g, (e) => e.preventDefault());
}
// **ダブルタップの拡大**は上では止まらない。2 回目のタップの touchend を潰す。
// ボタンや入力欄の上では潰さない(潰すとクリックが飛ばなくなる)
let lastTapAt = 0;
document.addEventListener('touchend', (e) => {
  if (e.target.closest('button, input, textarea, summary, label')) return;
  const now = Date.now();
  if (now - lastTapAt <= 350) e.preventDefault();
  lastTapAt = now;
}, { passive: false });
document.addEventListener('touchmove', (e) => {
  if (e.target.closest('#panel')) return;   // 計器盤の中だけは送れるように
  e.preventDefault();
}, { passive: false });

// ── パッド ────────────────────────────────────────────
const log = [];
const hits = new Map();   // code -> 押した時刻(立ち上がりを光らせる)

const touch = new TouchControls({
  onPress: (code, source) => {
    // 本番では mmsxx.input.press(code, source) へ素通しする。
    // ここは実験台なので、そのまま表に出すだけ
    hits.set(code, performance.now());
    addLog('PRESS  ', code, source);
  },
  onRelease: (code, source) => addLog('RELEASE', code, source),
});
const stage = document.getElementById('stage');
const panelEl = document.getElementById('panel');
const zoneA = document.getElementById('zoneA');
const zoneB = document.getElementById('zoneB');
/** 場所の決めごとは**器の持ちもの**(部品は中身だけ作る) */
const zone = { side: 'left', dpadZone: 28, shotZone: 28 };
touch.attach({ dpad: zoneA, shot: zoneB });
// 実機を繋いで中を覗くとき用(mmsxxDebug() と同じ考えかた)
window.touch = touch;

// ── 縦持ちのときは 90 度回して横で見せる ────────────────
// 「横にしてください」とは出さない(SMARTPHONE.md 7 節)。
// 回すのは**指で触る端末のときだけ**。PC で窓を縦長にしても回さない。
//
// **自動の判定が外れることがある**ので、手で回せるボタンも置く。
// ゲーム本体でも同じ考えかたが要る(縦固定・横固定はゲームごとに違い、
// 起動後には変えられない)。**判定はここ側の仕事**で、タッチの部品は
// 座標の変換(toLocal)を受け取るだけにしてある
let rotated = false;
/** 手で決めたときの向き。null なら自動に任せる */
let manual = null;

function layout() {
  const w = innerWidth, h = innerHeight;
  const auto = h > w && matchMedia('(pointer: coarse)').matches;
  rotated = manual === null ? auto : manual;
  if (rotated) {
    // 長い辺を横にする。原点を右上へ運んでから時計回りに 90 度
    stage.style.width = h + 'px';
    stage.style.height = w + 'px';
    stage.style.transform = `translateX(${w}px) rotate(90deg)`;
    // 画面の点を入れ物の点へ戻す(上の変換の逆)
    touch.toLocal = (x, y) => [y, w - x];
    // 計器盤を送る指は、画面の上では**横向き**になる
    panelEl.style.touchAction = 'pan-x';
  } else {
    stage.style.width = w + 'px';
    stage.style.height = h + 'px';
    stage.style.transform = 'none';
    touch.toLocal = null;
    panelEl.style.touchAction = 'pan-y';
  }
  document.getElementById('rotState').textContent =
    `向き: ${rotated ? '90度回している' : 'そのまま'}`
    + `（${manual === null ? '自動で判定' : '手で指定'}）`;
  syncPanel();
}

document.getElementById('rot').addEventListener('click', () => {
  manual = !rotated;      // いまと逆にする。以後は自動判定に戻さない
  layout();
});

// resize は途中の大きさでも飛んでくるので、次の描き替えまで待ってから測る
let layoutWait = 0;
function relayout() {
  if (layoutWait) return;
  layoutWait = requestAnimationFrame(() => { layoutWait = 0; layout(); });
}
addEventListener('resize', relayout);
addEventListener('orientationchange', relayout);

let lastLogAt = 0;
function addLog(kind, code, source) {
  const now = performance.now();
  const gap = lastLogAt ? Math.round(now - lastLogAt) : 0;
  lastLogAt = now;
  log.unshift({ kind, code, source, gap });
  if (log.length > 20) log.pop();
}

// ── つまみ ────────────────────────────────────────────
// [キー, 表示名, 最小, 最大, 刻み, 器の持ちものか, どちらの欄か, 長押しで出る説明]
const KNOBS = [
  ['deadzone', '不感帯px', 0, 40, 1, false, 'param',
   'これより内側に指があるうちは、どの向きも立たない。指の震えを拾わないための遊び'],
  ['dragMax', '引きずりpx', 16, 120, 1, false, 'param',
   '原点からこれ以上離すと、原点のほうが指に引きずられて付いてくる。エリアの端まで行っても操作を続けられる'],
  ['hysteresis', '重なり度', 0, 20, 1, false, 'param',
   '8 方向の境目の重なり。大きいほど、斜めと真横のあいだでばたつかない'],
  ['stickSmoothMs', '動きのならしms', 5, 200, 5, false, 'param',
   '「動きの向き」のとき、指の速さをどれだけならすか。'
   + '小さいほど機敏だが震えを拾って向きがばたつく。大きいほど落ち着くが折り返しがもたつく'],
  ['stickMinSpeed', '止まる速さ', 0.01, 0.4, 0.01, false, 'param',
   '「動きの向き」のとき、これより遅ければ止まっていることにする(px/ms)。'
   + '0.03 で秒速 30px ほど。大きくすると、ゆっくり動かしても止まったままになる'],
  ['stickFullSpeed', '全開の速さ', 0.05, 1, 0.05, false, 'param',
   'この速さで倒し量が 1 になる(px/ms)。小さいほど、ゆっくり動かしても自機が速く動く'],
  ['stickMaxPower', '倒し量の上限', 1, 4, 0.1, false, 'param',
   '倒し量をどこで頭打ちにするか。1 を超えると、速く払ったぶん自機が'
   + 'いつもの最高速より速く動く(指が自機より速いので、1 のままだと置いていかれる)。'
   + 'キーボードは常に 1 なので、上げすぎると指のほうが有利になる'],
  ['shotStep', 'しきい値px', 4, 80, 1, false, 'param',
   'こすりの折り返しと認めるまでに動かす距離。小さいほど小刻みなこすりで撃てるが、震えも拾いやすい'],
  ['holdRepeatMs', '長押しms(0=無)', 0, 500, 10, false, 'param',
   '指を置いたままのときに、この間隔で撃つ。0 なら撃たない(連射は腕前のまま)'],
  ['dpadZone', 'パッドエリア幅%', 10, 45, 1, true, 'gui',
   'パッドを置くエリアの幅。画面の幅に対する割合。'
   + '本番ではゲームが渡す DIV の大きさで決まるので、部品側は持っていない'],
  ['shotZone', 'ボタンエリア幅%', 10, 45, 1, true, 'gui',
   'ボタンを置くエリアの幅。画面の幅に対する割合。'
   + '本番ではゲームが渡す DIV の大きさで決まるので、部品側は持っていない'],
  ['guiRadius', 'PADの大きさpx', 16, 120, 1, false, 'gui',
   'PAD の大きさ。矢印の太さと長さ、はみ出しの許しかたもこれに連れて変わる'],
];

const knobsEl = document.getElementById('knobs');

// 方式のラジオ。A 区画割り / B 移動量 / C 出入り
const modeRow = document.createElement('div');
modeRow.className = 'row';
modeRow.innerHTML = '<span style="width:96px">方式</span>'
  + ['D 往復', 'A 区画', 'B 移動量', 'C 出入り'].map((t) => {
      const v = t[0];
      return `<label><input type="radio" name="mode" value="${v}"`
        + `${touch.opts.shotMode === v ? ' checked' : ''}> ${t}</label>`;
    }).join(' ');
knobsEl.appendChild(modeRow);
showHintOn(modeRow.querySelector('span'), modeRow,
  '方式: こすりの数えかた。D 往復=向きが変わるたびに 1 発(既定)。'
  + 'A 区画=区画をまたぐたび。B 移動量=動いた距離ぶん(一気に滑らせると出すぎる)。C 出入り=面に出入りするたび');
modeRow.addEventListener('change', (e) => {
  touch.setOptions({ shotMode: e.target.value });
  showValues();
});

// 十字の向きの決めかた。**手ざわりが丸ごと変わる**ので、見比べられるようにする
const stickRow = document.createElement('div');
stickRow.className = 'row';
stickRow.innerHTML = '<span style="width:96px">十字</span>'
  + [['move', '動きの向き'], ['origin', '触れた点から']].map(([v, t]) =>
      `<label><input type="radio" name="stick" value="${v}"`
      + `${touch.opts.stickMode === v ? ' checked' : ''}> ${t}</label>`).join(' ');
knobsEl.appendChild(stickRow);
showHintOn(stickRow.querySelector('span'), stickRow,
  '十字: 向きの決めかた。動きの向き=いま指が動いているほうへ進む。'
  + '折り返しがその場でつながり、指を止めれば止まる。'
  + '触れた点から=触れたところを原点にした倒しかたで決める。'
  + 'まっすぐ走り続ける遊び向きだが、折り返すには原点をまたぐまで戻す必要がある');
stickRow.addEventListener('change', (e) => {
  touch.setOptions({ stickMode: e.target.value });
  showValues();
});

// 画面の大きさぶんの伸び縮み。**いまの端末を真ん中とする**。
// px で決めたつまみ(不感帯・引きずり・大きさ・しきい値)にまとめて掛かる。
//
// つまみの位置(0〜100)から倍率を出す。**もとの 小 / 中 / 大 が 25 / 50 / 75% に
// 来る**よう、その 3 点を通る折れ線にしてある(等間隔に並べると中が真ん中に来ない)
const SIZE_STOPS = [[0, 0.4], [25, 0.7], [50, 1], [75, 1.5], [100, 2]];
function scaleAt(pos) {
  for (let i = 1; i < SIZE_STOPS.length; i++) {
    const [p0, v0] = SIZE_STOPS[i - 1], [p1, v1] = SIZE_STOPS[i];
    if (pos <= p1) return v0 + (v1 - v0) * (pos - p0) / (p1 - p0);
  }
  return SIZE_STOPS[SIZE_STOPS.length - 1][1];
}

const sizeRow = document.createElement('label');
sizeRow.className = 'knob';
sizeRow.innerHTML = '<span>画面の大きさ</span>'
  + '<input type="range" min="0" max="100" step="1" value="50">'
  + '<output>1.00</output>';
knobsEl.appendChild(sizeRow);
showHintOn(sizeRow.querySelector('span'), sizeRow,
  '画面の大きさ: **判定の大きさだけ**を変える倍率(不感帯・引きずり・しきい値)。'
  + '見た目の大きさは変わらない。いまの端末が真ん中(1.00)、'
  + '25% で小さい画面向け、75% で大きい画面向け。'
  + '大きい画面ほど指の動きも大きくなるので、そのぶん鈍くする');
sizeRow.addEventListener('input', (e) => {
  const v = Math.round(scaleAt(Number(e.target.value)) * 100) / 100;
  sizeRow.querySelector('output').textContent = v.toFixed(2);
  touch.setOptions({ scale: v });
  showValues();
});

/** つまみの値。器の持ちものと部品の持ちもの、どちらから読むか */
const valueOf = (key, mine) => (mine ? zone : touch.opts)[key];

/** 名前を触ると、**その項目の真下に**説明を出す */
const hintEl = document.getElementById('knobHint');
let hintClear = 0;
let hintOwner = null;
function closeHint() { hintEl.textContent = ''; hintOwner = null; }
function showHintOn(el, row, text) {
  el.classList.add('askable');
  el.addEventListener('click', () => {
    clearTimeout(hintClear);
    if (hintOwner === el) { closeHint(); return; }   // もう一度触ると閉じる
    row.after(hintEl);            // 触った行の下へ移す
    hintEl.textContent = text;
    hintOwner = el;
    hintClear = setTimeout(closeHint, 8000);
  });
}

const guiKnobsEl = document.getElementById('guiKnobs');
for (const [key, name, min, max, step, mine, group, hint] of KNOBS) {
  const el = document.createElement('label');
  el.className = 'knob';
  const v0 = valueOf(key, mine);
  el.innerHTML = `<span>${name}</span>`
    + `<input type="range" min="${min}" max="${max}" step="${step}" value="${v0}">`
    + `<output>${v0}</output>`;
  const range = el.querySelector('input');
  const out = el.querySelector('output');
  range.addEventListener('input', () => {
    const v = Number(range.value);
    out.textContent = v;
    if (mine) { zone[key] = v; syncPanel(); }
    else touch.setOptions({ [key]: v });
    showValues();
  });
  showHintOn(el.querySelector('span'), el, `${name}: ${hint}`);
  (group === 'gui' ? guiKnobsEl : knobsEl).appendChild(el);
}

// キャッシュに古いものが残るので、v を 1 つ増やして開き直す
document.getElementById('swap').addEventListener('click', () => {
  zone.side = zone.side === 'left' ? 'right' : 'left';
  syncPanel();
  showValues();
});

document.getElementById('reload').addEventListener('click', () => {
  const q = new URLSearchParams(location.search);
  q.set('v', String((Number(q.get('v')) || 0) + 1));
  location.replace(location.pathname + '?' + q);
});

document.getElementById('reset').addEventListener('click', () => {
  touch.reset();
  log.length = 0;
  hits.clear();
});

const valuesEl = document.getElementById('values');
document.getElementById('copy').addEventListener('click', () => {
  if (navigator.clipboard) navigator.clipboard.writeText(valuesEl.value).catch(() => {});
  valuesEl.select();
});

/** 決まった値を控えるための、そのまま貼れる形 */
function showValues() {
  const o = { ...zone, ...touch.opts };
  valuesEl.value = '{\n'
    + [...KNOBS.map(([k]) => k), 'shotMode', 'stickMode', 'side', 'scale']
        .map(k => `  ${k}: ${typeof o[k] === 'string' ? `'${o[k]}'` : o[k]},`)
        .join('\n')
    + '\n}';
}
showValues();

/** 計器盤を、左右のエリアに挟まれた真ん中へ収める */
function syncPanel() {
  const leftIsDpad = zone.side === 'left';
  const left = leftIsDpad ? zone.dpadZone : zone.shotZone;
  const right = leftIsDpad ? zone.shotZone : zone.dpadZone;
  const [lz, rz] = leftIsDpad ? [zoneA, zoneB] : [zoneB, zoneA];
  lz.style.left = '0'; lz.style.right = 'auto'; lz.style.width = left + '%';
  rz.style.right = '0'; rz.style.left = 'auto'; rz.style.width = right + '%';
  const p = document.getElementById('panel');
  p.style.left = left + '%';
  p.style.right = right + '%';
  // 名前は十字エリアの背景へ
  const brand = document.getElementById('brand');
  const dz = leftIsDpad ? { left: '0', right: 'auto' } : { left: 'auto', right: '0' };
  brand.style.left = dz.left; brand.style.right = dz.right;
  brand.style.width = zone.dpadZone + '%';
}
layout();   // 入れ物の大きさと向きを決める。中で syncPanel() も呼ぶ

// ── タッチ点を自前でも数える(パッドの外に置いた指も見たい) ──
const FINGER_COLORS = ['#ff5555', '#55ff55', '#5599ff', '#ffff55', '#ff55ff', '#55ffff'];
const fingers = new Map();
let fingerSeq = 0;
addEventListener('pointerdown', (e) => {
  fingers.set(e.pointerId, { x: e.clientX, y: e.clientY, n: fingerSeq++ });
}, true);
addEventListener('pointermove', (e) => {
  const f = fingers.get(e.pointerId);
  if (f) { f.x = e.clientX; f.y = e.clientY; }
}, true);
const drop = (e) => { fingers.delete(e.pointerId); if (!fingers.size) fingerSeq = 0; };
addEventListener('pointerup', drop, true);
addEventListener('pointercancel', drop, true);

// ── 毎コマ描き替える ──────────────────────────────────
const KEY_LIST = [
  ['ArrowUp', '↑'], ['ArrowDown', '↓'], ['ArrowLeft', '←'], ['ArrowRight', '→'],
  ['Space', 'SHOT'], ['Escape', 'PAUSE'],
];
const el = (id) => document.getElementById(id);

function frame() {
  const st = touch.state();
  const now = performance.now();

  // 上の帯: キーの状態
  el('keys').innerHTML = KEY_LIST.map(([code, name]) => {
    const down = st.down.includes(code);
    const hit = now - (hits.get(code) || -1e9) < 150;
    return `<span class="key${down ? ' down' : ''}${hit ? ' hit' : ''}">${name}</span>`;
  }).join('');

  // ③ タッチ点
  el('touchCount').textContent = `${fingers.size} 本`;
  const owners = new Map(st.pointers.map(p => [p.id, p.owner]));
  el('touches').innerHTML = fingers.size === 0 ? '<span class="dim">（触れていません）</span>'
    : [...fingers.entries()].map(([id, f]) =>
        `<div><span class="dot" style="background:${FINGER_COLORS[f.n % FINGER_COLORS.length]}"></span>`
        + `#${id} ${Math.round(f.x)},${Math.round(f.y)} `
        + `<span class="dim">${owners.get(id) || '—'}</span></div>`).join('');

  // ④ 相対十字
  const s = st.stick;
  // **決めかたで読むものが違う。** 原点を持たない「動きの向き」では、
  // 原点も距離も意味が無い(出すのは指の速さ)
  el('stick').innerHTML = !s.active ? '<span class="dim">（触れていません）</span>'
    : touch.opts.stickMode === 'move'
      ? `指 &nbsp;&nbsp;${Math.round(s.x)},${Math.round(s.y)}<br>`
        + `速さ ${s.speed.toFixed(3)} px/ms 角度 ${s.deg.toFixed(0)}度<br>`
        + `区画 ${s.sector < 0 ? '<span class="dim">なし（止まっている）</span>' : s.sector}`
      : `原点 ${Math.round(s.ox)},${Math.round(s.oy)}<br>`
        + `指 &nbsp;&nbsp;${Math.round(s.x)},${Math.round(s.y)}<br>`
        + `差 &nbsp;&nbsp;${Math.round(s.dx)},${Math.round(s.dy)} `
        + `距離 ${s.dist.toFixed(1)} 角度 ${s.deg.toFixed(0)}度<br>`
        + `区画 ${s.sector < 0 ? '<span class="dim">なし（不感帯）</span>' : s.sector}`;

  // ① こすり打ち
  el('rate').textContent = st.rub.rate;
  el('rateTop').textContent = st.rub.rate;
  el('maxRate').textContent = st.rub.maxRate;
  el('rub').innerHTML = `PRESS ${st.rub.pressCount} / RELEASE ${st.rub.releaseCount}`
    + ` / 移動 ${Math.round(st.rub.move)}px`
    + (touch.opts.shotMode === 'D' ? ` / 往復 ${st.rub.turns}` : '')
    + (touch.opts.shotMode === 'A' ? ` / 区画 ${st.rub.cell || '—'}` : '');

  // ② 端末・画面
  const forced = new URLSearchParams(location.search).get('device');
  el('device').innerHTML =
    `向き ${innerWidth >= innerHeight ? '横' : '縦'} / ${innerWidth}x${innerHeight}`
    + '<br>'
    + `dpr ${devicePixelRatio} / maxTouchPoints ${navigator.maxTouchPoints || 0}<br>`
    + `PADの大きさ ${touch.opts.guiRadius}`
    + (touch._r !== touch.opts.guiRadius
        ? ` <span style="color:#ffcc22">→ 実際 ${touch._r}（エリアが狭いので縮めた）</span>` : '')
    + '<br>'
    + `isMobileLike ${isMobileLike()}`
    + (forced ? ` <span class="dim">(?device=${forced} で上書き)</span>` : '');

  // ⑤ ログ
  el('log').innerHTML = log.map(e =>
    `<div class="${e.kind[0] === 'P' ? 'p' : 'r'}">`
    + `${e.kind} ${e.code.padEnd(10)} ${e.source} +${e.gap}ms</div>`).join('');

  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
